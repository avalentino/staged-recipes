context:
  version: "1.3.0"

package:
  name: gafa
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/gafa/gafa-${{ version }}.tar.gz
  sha256: abcec7ba8599a56ea82b9c0e6f27a1b3615876648ee1ee26a46a997e2a35c7b4

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - dask >=2025.12.0
    - gsar-sar >=1.3.0
    - numba
    - netcdf >=1.7.2
    - scipy
    - tqdm
    - xarray >=2025.09.0
  extras:
    crs:
    plotting:
      - matplotlib
      - gdar-sar[extras=[plotting]]
    interactive:
      - ipython >=8.30
      - gdar-sar[extras=[interactive]]
      - ipykernel >=7.1.0
      - ipympl >=0.9.8

tests:
  - python:
      imports:
      - gaga
      pip_check: true
  - script:
      - python -m pytest tests
    requirements:
      run:
        - pytest
    files:
      source:
        - tests/

about:
  homepage: https://pypi.org/project/gafa
  summary: 'GAFA -- The Geometry and Frequency Agnostic SAR processor'
  description: |
    GAFA — the Geometry And Frequency Agnostic SAR processor - is a Python
    library for synthetic-aperture radar (SAR) image formation and simulation.
    It focuses raw (Level-0) SAR data into focused (Level-1) imagery and can
    produce simulated raw data from a scene description, working in a
    geometry- and frequency-agnostic formulation so the same code paths
    apply to monostatic, bistatic, spaceborne, and ground-based instruments
     across the microwave bands covered by ESA / NASA / JAXA SAR missions.
  license: Apache-2.0 or LicenseRef-ESA-PL-Permissive-2.5
  license_file:
    - LICENSE-Apache-2.0.txt
    - LICENSE-ESA-PL-Permissive-2.5.txt
  documentation: https://earth-observation-public.pages.norce.dev/gafa-doc

extra:
  recipe-maintainers:
    - avalentino
    - ylarsen
